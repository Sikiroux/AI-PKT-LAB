const trainingDocuments=[
 {id:'ticket-queue',title:'Comprendre la file des tickets',category:'Parcours',paragraphs:['Les formulations et l’urgence déclarée varient avec la seed. La priorité initiale décrit un besoin déclaré, pas un diagnostic technique : tu peux la réévaluer selon ton constat. Le poste et le demandeur restent ceux de l’entreprise active.','Les demandes À préparer peuvent arriver pendant une intervention, sans modifier les postes. Le premier ticket d’une nouvelle entreprise est choisi par sa seed parmi plusieurs familles.','Préparer et prendre en charge matérialise la panne et démarre le chronomètre. Un seul scénario est actif ; le mettre en attente ne permet pas d’en préparer un autre avant sa clôture.','Dans Tickets, le panneau de file permet de revenir à l’intervention active. Les filtres À préparer et Intervention active distinguent la file de demandes du scénario technique.','Arrivées automatiques permet de choisir le catalogue, l’intervalle et le plafond de tickets ouverts. Le compteur annonce une tentative : le plafond peut la différer. Les arrivées sont mises en pause au redémarrage du logiciel.']},
 {id:'local-access',title:'Consulter les accès locaux',category:'Postes',paragraphs:['Depuis Fiches des postes, sélectionner le PC puis Accès locaux. La vue Ordinateurs de l’annuaire donne également ce lien lorsqu’un poste est associé.','Afficher le mot de passe local révèle uniquement le credential de formation enregistré dans le coffre. Masquer efface son affichage. Ce registre est distinct des comptes et secrets AD.','L’identifiant .\\support.local désigne un compte du poste, pas du domaine. Tester la connexion locale vérifie réellement ce compte dans le moteur ; cela n’ouvre pas une nouvelle session RDP et ne donne pas accès aux partages du domaine.','Changer le mot de passe met à jour le compte et le coffre ensemble et ferme son ancienne session locale. Un compte désactivé refuse la connexion. Les secrets saisis ne sont pas copiés dans le journal.']},

 {id:'directory',title:'Utiliser l’annuaire',category:'Administration',paragraphs:['Annuaire propose les vues Utilisateurs, Groupes, Ordinateurs, Unités d’organisation, Historique et Stratégie.','Rechercher le bon compte, puis ouvrir ses propriétés ou son appartenance aux groupes. Une modification depuis une vue périmée impose un rafraîchissement.','Les mots de passe AD ne sont pas consultables dans cette console. Une réinitialisation peut afficher le mot de passe temporaire de formation. Le coffre d’accès locaux des postes n’est pas encore disponible.']},
