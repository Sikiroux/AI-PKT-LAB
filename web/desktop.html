 const upload=button('Envoyer vers le dépôt',actions,()=>safe(async()=>{const name=selectedLocal;if(!name)throw Error('Sélectionne un fichier local.');if(remoteFiles.some(f=>f.name===name)&&!confirm('Remplacer le fichier distant « '+name+' » ?'))return;out.textContent='Envoi en cours…';const v=await api('desktop/endpoint/read-local',{name});await run('upload',{name:v.name,content:v.content,expected_revision:revision});log('Envoyé : '+name);await listing();out.textContent='Envoi simulé terminé.'}));
 draw();safe(localList);
})}
function ftpAdmin(){openApp('ftp-admin','Gestionnaire du dépôt FTP',content=>{
 const frame=consoleFrame(content,[['overview','Service et accès',(p,d)=>{const f=d.service;consoleText(p,d.server.name+' · '+d.server.ip,'console-banner');consoleStats(p,[['Service FTP',f.service_running?'Démarré':'Arrêté'],['Canal de contrôle',f.control_allowed?'Autorisé':'Bloqué'],['Canal de données',f.data_allowed?'Autorisé':'Bloqué'],['Comptes',Object.keys(f.accounts).length]]);for(const [operation,key,label] of [['set_service','service_running','Service FTP'],['set_control','control_allowed','Canal de contrôle'],['set_data','data_allowed','Canal de données']])button(label+' · '+(f[key]?'désactiver':'activer'),p,()=>operate(operation,{value:!f[key]}));consoleText(p,'Le canal de contrôle sert à la session ; le canal de données sert aux transferts. Un ping réussi ne valide pas FTP.')}],
 ['accounts','Comptes et droits',(p,d)=>{for(const [username,a] of Object.entries(d.service.accounts)){const h=document.createElement('h3');h.textContent=username;p.append(h);for(const [key,label] of [['enabled','Compte actif'],['read','Lire / télécharger'],['write','Envoyer']]){const row=document.createElement('label'),b=document.createElement('input');row.className='console-principal';b.type='checkbox';b.checked=a[key];row.append(b,document.createTextNode(label));p.append(row);b.onchange=()=>operate('set_account',{username,field:key,value:b.checked})}button('Réinitialiser '+username,p,()=>{if(confirm('Réinitialiser le mot de passe de formation du compte '+username+' ?'))return operate('reset_password',{username})})}consoleText(p,'Une modification invalide les connexions FTP simulées. Reconnecte le client après intervention.')}],
 ['storage','Fichiers et capacité',(p,d)=>{const f=d.service,used=f.files.reduce((n,x)=>n+x.size,0);consoleStats(p,[['Occupation',used+' octets'],['Capacité',f.capacity_bytes+' octets']]);const table=consoleTable(p,['Fichier','Taille']);for(const file of f.files){const row=document.createElement('tr'),name=document.createElement('td'),size=document.createElement('td');name.textContent=file.name;size.textContent=file.size+' octets';row.append(name,size);table.append(row)}const capacity=field(p,'Capacité du dépôt en octets',f.capacity_bytes,'number');button('Enregistrer la capacité',p,()=>operate('set_capacity',{bytes:Number(capacity.value)}));consoleText(p,'Cette console administre le dépôt. Pour transférer un fichier, ouvre Client FTP sur le poste utilisateur.')}]]);
 const reload=async()=>{try{frame.set(await api('desktop/ftp/admin',{}))}catch(e){frame.set(null);throw e}};
 const operate=(operation,payload)=>frame.run(async()=>{await api('desktop/ftp/operation',{operation,payload});await reload();frame.message.textContent='Configuration enregistrée.'});button('Actualiser la console',content,()=>frame.run(reload));frame.draw();frame.run(reload);
})}
function diagnosticsApp(){openApp('diagnostics','Paramètres et diagnostics',content=>{const frame=document.createElement('iframe');frame.title='Diagnostics de l’environnement';frame.style.cssText='width:100%;height:100%;min-height:350px;border:0';frame.src=base+'/diagnostics'+(expectedClient?'?client_serial='+encodeURIComponent(expectedClient):'')+'#'+encodeURIComponent(expectedEnvironment);content.append(frame)})}
function appIcon(id){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 48 48');svg.setAttribute('width','44');svg.setAttribute('height','44');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','2');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');const shapes={deployment:['M6 10h36v24H6zM13 40h22M24 34v6','M17 18h14v8H17zM24 14v16'],ftp:['M6 12h14l4 5h18v24H6z','M14 25h20m-5-5 5 5-5 5M34 34H14m5-5-5 5 5 5'],'ftp-admin':['M9 6h30v12H9zM9 20h30v12H9zM9 34h30v8H9z','M15 12h2M15 26h2M15 38h2M25 12h8M25 26h8'],remote:['M7 9h34v24H7z','M17 41h14M24 33v8'],terminal:['M6 10h36v28H6z','m13 18 7 6-7 6M25 30h10'],notes:['M12 5h24v38H12z','M18 15h12M18 23h12M18 31h8'],directory:['M9 37v-4c0-7 12-7 12 0v4M27 37v-4c0-7 12-7 12 0v4','M15 10a5 5 0 1 0 0 10 5 5 0 1 0 0-10M33 10a5 5 0 1 0 0 10 5 5 0 1 0 0-10'],dns:['M24 5a19 19 0 1 0 0 38 19 19 0 1 0 0-38','M5 24h38M24 5c-13 12-13 26 0 38M24 5c13 12 13 26 0 38'],printers:['M14 18V6h20v12M14 33H6V18h36v15h-8M14 27h20v16H14z','M34 23h2'],mobility:['M7 13h34v23H7zM17 13V7h14v6','M22 23h4v5h-4z'],login:['M24 7a7 7 0 1 0 0 14 7 7 0 1 0 0-14','M9 41v-6c0-14 30-14 30 0v6'],settings:['M24 7v7M24 34v7M7 24h7M34 24h7','M24 15a9 9 0 1 0 0 18 9 9 0 1 0 0-18']};for(const d of shapes[id]||['M5 13h15l4 5h19v23H5z']){const path=document.createElementNS(ns,'path');path.setAttribute('d',d);svg.append(path)}return svg}
function updateIcons(s){const root=document.getElementById('desktopIcons');if(!root)return;const ids=technician?['diagnostics','remote','deployment','terminal','notes','directory','file-admin','dns','mobility','printers','ftp-admin']:['local-files',...(s.desktop_services?.endpoint.applications||['documents','terminal','dns','login'])];const signature=ids.join(',');if(root.dataset.signature===signature)return;root.dataset.signature=signature;root.replaceChildren();const catalogue={diagnostics:['⚙ Diagnostics',diagnosticsApp],deployment:['▣ Déploiement',deploymentApp],'remote':['💻 Accès distant',remote],terminal:['⌨ Terminal réseau',terminal],notes:['📝 Notes',notes],directory:['👥 Annuaire',directory],'file-admin':['📁 Partages',fileAdmin],dns:['🌐 DNS',dnsConsole],mobility:['💼 Mobilité et VPN',mobility],printers:['🖨 Imprimantes',printingApp],'ftp-admin':['🗄 Serveur FTP',ftpAdmin],ftp:['📤 Client FTP',ftpClient],settings:['⚙ Paramètres',endpointSettings],documents:['📁 Documents partagés',explorer],login:['👤 Session utilisateur',login],'local-files':['📝 Fichiers locaux',localFiles]};launchEntries=ids.filter(id=>catalogue[id]).map(id=>({id,label:catalogue[id][0].split(' ').slice(1).join(' '),run:catalogue[id][1]}));drawLauncher();for(const id of ids){const entry=catalogue[id];if(entry){const icon=button(entry[0],root,entry[1]),symbol=document.createElement('span'),label=document.createElement('span');symbol.className='desktop-symbol';symbol.setAttribute('aria-hidden','true');symbol.append(appIcon(id));label.className='desktop-label';label.textContent=entry[0].split(' ').slice(1).join(' ');icon.replaceChildren(symbol,label);icon.setAttribute('aria-label',label.textContent)}}if(!technician){document.getElementById('explorer').hidden=!ids.includes('documents');const dns=document.getElementById('clientDNS');if(dns)dns.hidden=!ids.includes('dns')}}

function drawLauncher(){const root=document.getElementById('launcherApps');if(!root)return;root.replaceChildren();const q=(document.getElementById('launcherSearch').value||'').toLocaleLowerCase();const shown=launchEntries.filter(e=>e.label.toLocaleLowerCase().includes(q));for(const entry of shown){const b=button('',root,()=>{document.getElementById('launcher').hidden=true;document.getElementById('launcherToggle').setAttribute('aria-expanded','false');entry.run()});b.append(appIcon(entry.id),document.createTextNode(entry.label))}document.getElementById('launcherEmpty').hidden=shown.length>0}
function consoleFrame(content,tabs){const shell=document.createElement('div'),nav=document.createElement('nav'),main=document.createElement('section');shell.className='console-shell';nav.className='console-nav';main.className='console-main';nav.setAttribute('aria-label','Sections de la console');shell.append(nav,main);content.append(shell);const message=report(content);let active=tabs[0][0],data=null,busy=false;const controls=[];function draw(){controls.forEach(([id,b])=>b.setAttribute('aria-pressed',String(id===active)));main.replaceChildren();if(!data){const p=document.createElement('p');p.textContent='Actualise la console après vérification du réseau du technicien.';main.append(p);return}const tab=tabs.find(t=>t[0]===active),h=document.createElement('h2');h.textContent=tab[1];main.append(h);tab[2](main,data)}for(const [id,label] of tabs){const b=button(label,nav,()=>{if(!busy){active=id;draw()}});controls.push([id,b])}return{shell,main,message,draw,set(value){data=value;draw()},async run(fn){if(busy)return;busy=true;shell.setAttribute('aria-busy','true');try{message.textContent='';await fn()}catch(e){draw();message.textContent=e.message}finally{busy=false;shell.setAttribute('aria-busy','false')}}}}
function consoleText(parent,text,cls='app-help'){const p=document.createElement('p');p.className=cls;p.textContent=text;parent.append(p);return p}
function consoleStats(parent,items){const grid=document.createElement('div');grid.className='console-stats';parent.append(grid);for(const [label,value] of items){const card=document.createElement('div'),n=document.createElement('strong');card.className='console-stat';card.append(document.createTextNode(label));n.textContent=value;card.append(n);grid.append(card)}}
function consoleTable(parent,headers){const table=document.createElement('table'),head=document.createElement('thead'),row=document.createElement('tr');table.className='app-table';for(const label of headers){const th=document.createElement('th');th.setAttribute('scope','col');th.textContent=label;row.append(th)}head.append(row);table.append(head);parent.append(table);return table}
async function boot(){try{const s=await api('state');if(!s||(expectedEnvironment&&s.environment_id!==expectedEnvironment)||(expectedClient&&s.client_serial!==expectedClient)||(!technician&&(!s.remote_session||!s.checks.remote.allowed))){closeSession();return}expectedEnvironment=s.environment_id;if(!technician)expectedClient=s.client_serial;const {Core,CoreServiceProvider}=osjsClient;core=new Core({standalone:true,development:false,ws:{disabled:true},packages:{metadata:[],manifest:null},session:{enabled:false}},{root:document.getElementById('root')});core.register(CoreServiceProvider);core.singleton('osjs/settings',()=>({get:()=>undefined,set:()=>({save:async()=>true})}));if(!await core.boot())throw Error('Démarrage OS.js impossible');updateIcons(s);document.getElementById('status').textContent=s.devices[technician?'technician':'client'].name+' · '+s.company;if(technician&&new URLSearchParams(location.search).get('app')==='deployment')deploymentApp();else if(!technician&&(s.desktop_services?.endpoint.applications||['documents']).includes('documents'))explorer()}catch(e){document.getElementById('status').textContent=e.message}}
document.getElementById('launcherToggle').onclick=()=>{const menu=document.getElementById('launcher');menu.hidden=!menu.hidden;document.getElementById('launcherToggle').setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)document.getElementById('launcherSearch').focus()};document.getElementById('launcherClose').onclick=()=>{document.getElementById('launcher').hidden=true;document.getElementById('launcherToggle').setAttribute('aria-expanded','false')};document.getElementById('launcherSearch').oninput=drawLauncher;document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('launcher').hidden=true;document.getElementById('launcherToggle').setAttribute('aria-expanded','false')}});document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.getElementById('status').textContent='Plein écran indisponible : ouvre le bureau dans un onglet séparé.'}};document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').textContent=document.fullscreenElement?'Quitter le plein écran':'Plein écran');
if(technician){document.title='Bureau du technicien';document.getElementById('explorer').textContent='Accès distant';document.getElementById('disconnect').textContent='Fermer le bureau';document.getElementById('offline').textContent='Cet environnement a changé ou n’est plus disponible. Rouvre le bureau depuis la session active.';}
async function remote(){openApp('remote','Accès distant · Choisir un poste',content=>{
 const heading=consoleText(content,'Chaque session est liée au numéro de série du poste choisi.','console-banner'),list=document.createElement('div'),out=report(content);list.className='remote-list';content.append(list);let busy=false;
 async function reload(){const s=await api('state');list.replaceChildren();for(const pc of (s.workstations||[]).filter(p=>p.remote_supported)){const card=document.createElement('div');card.className='remote-card';const title=document.createElement('strong');title.textContent=pc.name;card.append(title);consoleText(card,(pc.user||'Utilisateur non associé')+' · '+(pc.ip||'IP non relevée'));const status=consoleText(card,pc.status==='passed'?'Accessible au dernier contrôle':pc.status==='failed'?'Inaccessible au dernier contrôle':'Réseau à vérifier');status.className='remote-state '+pc.status;button('Prendre la main sur '+pc.name,card,async()=>{if(busy)return;busy=true;out.textContent='Connexion à '+pc.name+'…';try{await api('action',{action:'connect',target_serial:pc.serial});const opened=window.open(base+'/desktop?client_serial='+encodeURIComponent(pc.serial)+'#'+encodeURIComponent(expectedEnvironment),'_blank','noopener');out.textContent='Session ouverte pour '+pc.name+'. Si l’onglet ne s’affiche pas, autorise les nouvelles fenêtres.'}catch(e){out.textContent=e.message}finally{busy=false}});list.append(card)}if(!list.children.length)consoleText(list,'Aucun bureau client disponible dans cette entreprise.');heading.textContent='Postes de '+s.company+' · Les contrôles réseau proviennent de Packet Tracer.'}
 button('Actualiser les postes',content,()=>reload().catch(e=>out.textContent=e.message));reload().catch(e=>out.textContent=e.message);
})}

if(!technician){const dnsButton=document.createElement('button');dnsButton.id='clientDNS';dnsButton.textContent='DNS';dnsButton.onclick=dnsConsole;document.getElementById('bar').prepend(dnsButton);const b=document.createElement('button');b.textContent='Session utilisateur';b.onclick=login;document.getElementById('bar').prepend(b)}
document.getElementById('explorer').onclick=technician?remote:explorer;document.getElementById('terminal').onclick=terminal;document.getElementById('disconnect').onclick=async()=>{if(technician){closeSession();window.close();return}try{await api('action',{action:'disconnect'})}finally{closeSession()}};boot();setInterval(check,2000);
