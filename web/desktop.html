<script src="/osjs/main.js"></script><script>
const technician=__TECHNICIAN__;
const token='__TOKEN__',base='__API_BASE__';let core=null,stopped=false,polling=false;let expectedEnvironment=decodeURIComponent(location.hash.slice(1))||null;const windows=new Map();
async function api(path,data){const r=await fetch(base+'/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Diagnostic-Token':token},body:data===undefined?undefined:JSON.stringify({...data,environment_id:expectedEnvironment})});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
function closeSession(){if(stopped)return;stopped=true;for(const w of windows.values())w.destroy();windows.clear();if(core)core.destroy();document.getElementById('offline').hidden=false}
async function check(){if(polling||stopped)return;polling=true;try{const s=await api('state');if(!s||(expectedEnvironment&&s.environment_id!==expectedEnvironment)||(!technician&&(!s.remote_session||!s.checks.remote.allowed))){closeSession();return}updateIcons(s);document.getElementById('status').textContent=s.devices[technician?'technician':'client'].name+' · '+s.devices[technician?'technician':'client'].ip+' · '+s.company+(technician?' · Bureau du technicien':'')}catch(e){if(technician)document.getElementById('status').textContent='Serveur local indisponible · notes conservées dans le navigateur';else closeSession()}finally{polling=false}}
function openApp(id,title,render){if(stopped||!core)return;if(windows.has(id)){windows.get(id).raise();windows.get(id).focus();return}const w=core.make('osjs/window',{id,title,dimension:{width:Math.max(300,Math.min(720,innerWidth-50)),height:Math.max(260,Math.min(540,innerHeight-130))},position:{left:35+windows.size*25,top:25+windows.size*20},attributes:{minimizable:true,maximizable:true}});windows.set(id,w);const task=button(title,document.getElementById('tasks'),()=>{w.raise();w.focus()});w.on('destroy',()=>{windows.delete(id);task.remove()});w.render(render);w.focus()}
function button(label,parent,fn){const b=document.createElement('button');b.textContent=label;parent.append(b);b.onclick=async()=>{b.disabled=true;try{await fn()}finally{b.disabled=false}};return b}
function explorer(){openApp('documents','Explorateur · Documents partagés',content=>{const listing=document.createElement('select'),name=document.createElement('input'),editor=document.createElement('textarea'),message=document.createElement('p');listing.setAttribute('aria-label','Fichier partagé');name.placeholder='Nom du nouveau fichier';name.value='Nouveau.txt';editor.setAttribute('aria-label','Contenu du fichier');editor.style.cssText='width:95%;height:150px';let revision=null,share=null,selected=null,selectedRevision=null;content.append(listing,name,editor,message);const run=async request=>{const v=await api('files/action',{request});revision=v.revision;if(!v.result.allowed)throw Error(v.result.code);return v.result};const reload=async()=>{try{const st=await api('state');share=st.documents_share_id;const v=await run({action:'list',share_id:share});listing.replaceChildren();for(const f of v.data){const o=document.createElement('option');o.value=f.id;o.textContent=f.name+(f.read_only?' · lecture seule':'');listing.append(o)}message.textContent='Liste actualisée.'}catch(e){listing.replaceChildren();message.textContent=e.message}await check()};button('Actualiser',content,reload);button('Ouvrir',content,async()=>{try{const v=await run({action:'read',share_id:share,file_id:listing.value});selected=v.data.id;selectedRevision=revision;name.value=v.data.name;editor.value=v.data.content;message.textContent='Fichier ouvert.'}catch(e){selected=null;editor.value='';message.textContent=e.message}await check()});button('Nouveau',content,async()=>{selected=null;name.value='Nouveau.txt';editor.value='';message.textContent='Saisis le nom et le contenu puis enregistre.'});button('Enregistrer',content,async()=>{try{const req={action:'write',share_id:share,content:editor.value,expected_revision:selected?selectedRevision:revision};if(selected)req.file_id=selected;else req.name=name.value;const v=await run(req);selected=v.data.id;selectedRevision=revision;await reload();message.textContent=v.code==='QUOTA_WARNING'?'Enregistré · quota souple dépassé.':'Fichier enregistré.'}catch(e){message.textContent=e.message}await check()});button('Supprimer',content,async()=>{if(!listing.value||!confirm('Supprimer ce fichier simulé ?'))return;try{await run({action:'delete',share_id:share,file_id:listing.value,expected_revision:revision});selected=null;editor.value='';await reload()}catch(e){message.textContent=e.message}await check()});reload()})}
function fileAdmin(){openApp('file-admin','Partages · Permissions et capacité',content=>{let data=null;const shares=document.createElement('select'),layer=document.createElement('select'),action=document.createElement('select'),grants=document.createElement('div'),info=document.createElement('p'),message=document.createElement('p');for(const key of ['share_acl','folder_acl']){const o=document.createElement('option');o.value=key;o.textContent=key==='share_acl'?'Permissions du partage':'Permissions des fichiers';layer.append(o)}for(const key of ['list','read','write','delete']){const o=document.createElement('option');o.value=key;o.textContent={list:'Lister',read:'Lire',write:'Écrire',delete:'Supprimer'}[key];action.append(o)}content.append(shares,layer,action,info,grants,message);const operate=async(operation,payload)=>{try{await api('files/operation',{operation,payload});await reload();message.textContent='Modification enregistrée.'}catch(e){message.textContent=e.message}};function show(){if(!data)return;const service=data.service,share=service.shares[shares.value];info.textContent='Service : '+service.service_status+' · TCP 445 : '+(service.firewall_tcp445_allowed?'autorisé':'bloqué')+' · Disque : '+service.volume.used_bytes+'/'+service.volume.capacity_bytes+' octets · Quota : '+share.quota.mode+' '+(share.quota.limit_bytes??'');grants.replaceChildren();const acl=share[layer.value];for(const [kind,objects] of [['user_ids',data.directory.users],['group_ids',data.directory.groups]])for(const obj of Object.values(objects)){const row=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=acl[action.value][kind].includes(obj.id);row.style.display='block';row.append(check,document.createTextNode((obj.display_name||obj.name)+' · '+(kind==='user_ids'?'utilisateur':'groupe')));check.onchange=()=>{const next=structuredClone(acl);next[action.value][kind]=check.checked?[...new Set([...next[action.value][kind],obj.id])]:next[action.value][kind].filter(x=>x!==obj.id);operate('set_acl',{share_id:shares.value,layer:layer.value,action:action.value,user_ids:next[action.value].user_ids,group_ids:next[action.value].group_ids})};grants.append(row)}}const reload=async()=>{try{const v=await api('files/admin',{});data=v;const selected=shares.value;shares.replaceChildren();for(const share of Object.values(v.service.shares)){const o=document.createElement('option');o.value=share.id;o.textContent=share.name;shares.append(o)}shares.value=v.service.shares[selected]?selected:v.documents_share_id;show()}catch(e){message.textContent=e.message}};shares.onchange=show;layer.onchange=show;action.onchange=show;button('Actualiser',content,reload);button('Démarrer / arrêter le service',content,()=>data?operate('set_service_status',{status:data.service.service_status==='running'?'stopped':'running'}):reload());button('Autoriser / bloquer TCP 445',content,()=>data?operate('set_firewall',{allowed:!data.service.firewall_tcp445_allowed}):reload());button('Activer / désactiver le partage',content,()=>data?operate('set_share_enabled',{share_id:shares.value,enabled:!data.service.shares[shares.value].enabled}):reload());const mode=document.createElement('select');for(const key of ['off','hard','soft']){const o=document.createElement('option');o.value=key;o.textContent={off:'Sans quota',hard:'Quota dur',soft:'Quota souple'}[key];mode.append(o)}const bytes=document.createElement('input');bytes.type='number';bytes.min='1';bytes.value='1048576';bytes.setAttribute('aria-label','Quota en octets');content.append(mode,bytes);button('Appliquer le quota en octets',content,()=>data?operate('set_quota',{share_id:shares.value,mode:mode.value,limit_bytes:mode.value==='off'?null:Number(bytes.value)}):reload());const fileChoice=document.createElement('select');fileChoice.setAttribute('aria-label','Fichier à protéger');content.append(fileChoice);button('Choisir un fichier',content,async()=>{if(!data)return;fileChoice.replaceChildren();for(const f of Object.values(data.service.files)){const o=document.createElement('option');o.value=f.id;o.textContent=f.name+(f.read_only?' · lecture seule':'');fileChoice.append(o)}});button('Basculer lecture seule',content,()=>data&&data.service.files[fileChoice.value]?operate('set_file_read_only',{file_id:fileChoice.value,read_only:!data.service.files[fileChoice.value].read_only}):reload());const capacity=document.createElement('input');capacity.type='number';capacity.min='1';capacity.value='10485760';capacity.setAttribute('aria-label','Capacité disque en octets');content.append(capacity);button('Appliquer la capacité en octets',content,()=>data?operate('set_volume_capacity',{capacity_bytes:Number(capacity.value)}):reload());reload()})}
function terminal(){openApp('terminal','Terminal · Ping dans Packet Tracer',($content)=>{const p=document.createElement('p');p.textContent=technician?'Commande exécutée sur le poste du technicien dans Packet Tracer.':'Commande exécutée sur le poste client simulé dans Packet Tracer.';const input=document.createElement('input');input.placeholder='Adresse IPv4 ou IPv6';input.setAttribute('aria-label','Destination du ping');const output=document.createElement('pre');output.textContent='En attente d’une commande.';$content.append(p,input);api('state').then(s=>{if(s)input.value=s.devices.server.ip});button('Ping',$content,async()=>{output.textContent='Ping en cours…';try{const v=await api('ping',{target:input.value,source:technician?'technician':'client'});output.textContent=v.detail||'Aucun résultat'}catch(e){output.textContent=e.message}await check()});$content.append(output)})}
function login(){openApp('login','Session utilisateur · Annuaire simulé',content=>{const who=document.createElement('p'),message=document.createElement('p');message.className='app-message';content.append(who);api('state').then(s=>{who.textContent='Utilisateur : '+(s.directory_login?.username||'non disponible')});const password=document.createElement('input');password.type='password';password.placeholder='Mot de passe de formation';password.setAttribute('aria-label','Mot de passe de formation');content.append(password);button('Se connecter',content,async()=>{try{const v=await api('directory/login',{password:password.value});message.textContent=v.result.allowed?'Utilisateur connecté.':v.result.code}catch(e){message.textContent=e.message}finally{password.value=''}});const next=document.createElement('input');next.type='password';next.placeholder='Nouveau mot de passe (8 caractères min.)';next.setAttribute('aria-label','Nouveau mot de passe');content.append(next);button('Changer mon mot de passe',content,async()=>{try{const v=await api('directory/change-password',{old_password:password.value,new_password:next.value});message.textContent=v.result.allowed?'Mot de passe changé ; utilisateur connecté.':v.result.code}catch(e){message.textContent=e.message}finally{password.value='';next.value=''}});button('Déconnecter l’utilisateur',content,async()=>{await api('directory/logout',{});message.textContent='Utilisateur déconnecté.'});content.append(message)})}
function directory(){openApp('directory','Annuaire · Utilisateurs et groupes',content=>{const message=document.createElement('p'),users=document.createElement('select'),groups=document.createElement('div');users.setAttribute('aria-label','Utilisateur de l’annuaire');message.className='app-message';let data=null;content.append(users,groups,message);const reload=async()=>{try{const v=await api('directory/state',{});data=v.directory;const selected=users.value;users.replaceChildren();for(const user of Object.values(data.users)){const o=document.createElement('option');o.value=user.id;o.textContent=user.display_name+' · '+user.username+(user.enabled?'':' · désactivé');users.append(o)}if(data.users[selected])users.value=selected;else users.value=v.requester_id;show();message.textContent='Domaine : '+data.domain.dns_name}catch(e){message.textContent=e.message}};const operate=async(operation,payload)=>{try{const v=await api('directory/operation',{operation,payload});await reload();message.textContent=v.result.temporary_password?'Mot de passe temporaire (à transmettre une seule fois) : '+v.result.temporary_password+' · changement obligatoire':v.result.code}catch(e){message.textContent=e.message}};function show(){groups.replaceChildren();const u=data.users[users.value];const info=document.createElement('p');info.textContent='Compte '+(u.enabled?'actif':'désactivé')+' · '+(u.locked_until&&u.locked_until>Date.now()/1000?'verrouillé':'déverrouillé')+' · '+(u.must_change_password?'mot de passe à changer':'');groups.append(info);for(const g of Object.values(data.groups)){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=g.member_user_ids.includes(u.id);check.onchange=()=>operate(check.checked?'add_group_member':'remove_group_member',{group_id:g.id,user_id:u.id});label.append(check,document.createTextNode(g.name));label.style.display='block';groups.append(label)}}users.onchange=show;button('Actualiser',content,reload);button('Déverrouiller',content,()=>data?operate('unlock_user',{user_id:users.value}):reload());button('Activer / désactiver',content,()=>data?operate('set_user_enabled',{user_id:users.value,enabled:!data.users[users.value].enabled}):reload());button('Réinitialiser le mot de passe',content,()=>data?operate('reset_password',{user_id:users.value}):reload());reload()})}
function dnsConsole(){openApp('dns','DNS · Résolution et configuration',content=>{const source=technician?'technician':'client',host=document.createElement('input'),type=document.createElement('select'),out=document.createElement('pre');host.placeholder='Nom court ou complet';host.setAttribute('aria-label','Nom DNS');for(const t of ['A','AAAA','CNAME']){const o=document.createElement('option');o.value=t;o.textContent=t;type.append(o)}content.append(host,type,out);api('state').then(s=>host.value=s.documents_dns_name||'');button('Résoudre',content,async()=>{try{const v=await api('dns/resolve',{source,query:{name:host.value,type:type.value}});out.textContent=JSON.stringify(v.result,null,2)}catch(e){out.textContent=e.message}});button('Vider mon cache',content,async()=>{try{const v=await api('dns/flush',{source});out.textContent=v.result.code}catch(e){out.textContent=e.message}});if(!technician)return;let data=null;const records=document.createElement('select'),name=document.createElement('input'),rtype=document.createElement('select'),value=document.createElement('input'),ttl=document.createElement('input'),enabled=document.createElement('input');for(const t of ['A','AAAA','CNAME']){const o=document.createElement('option');o.value=t;o.textContent=t;rtype.append(o)}name.placeholder='Nom complet';value.placeholder='Adresse ou cible CNAME';ttl.type='number';ttl.min='0';ttl.max='86400';ttl.value='300';enabled.type='checkbox';enabled.checked=true;for(const [el,label] of [[records,'Enregistrement DNS'],[name,'Nom complet'],[rtype,'Type'],[value,'Adresse ou cible'],[ttl,'TTL en secondes'],[enabled,'Actif']])el.setAttribute('aria-label',label);content.append(records,name,rtype,value,ttl,enabled);const operate=async(operation,payload)=>{try{await api('dns/operation',{operation,payload});await reload();out.textContent='Configuration enregistrée. Les caches existants restent valides jusqu’à expiration.'}catch(e){out.textContent=e.message}};function select(){const r=data?.service.records[records.value];name.value=r?.name||'';rtype.value=r?.type||'A';value.value=r?.value||'';ttl.value=r?.ttl??300;enabled.checked=r?.enabled??true}const reload=async()=>{try{data=await api('dns/admin',{});records.replaceChildren();const fresh=document.createElement('option');fresh.value='';fresh.textContent='Nouvel enregistrement';records.append(fresh);for(const r of Object.values(data.service.records)){const o=document.createElement('option');o.value=r.id;o.textContent=r.name+' · '+r.type+' → '+r.value+(r.enabled?'':' · désactivé');records.append(o)}select();out.textContent='Zone : '+data.service.server.zone+' · service '+data.service.service_status+' · transport '+(data.service.transport_allowed?'autorisé':'bloqué')}catch(e){out.textContent=e.message}};records.onchange=select;button('Actualiser la console',content,reload);button('Enregistrer l’entrée',content,()=>operate('upsert_record',{record_id:records.value||undefined,name:name.value,type:rtype.value,value:value.value,ttl:Number(ttl.value),enabled:enabled.checked}));button('Supprimer l’entrée',content,()=>{if(records.value&&confirm('Supprimer cet enregistrement simulé ?'))operate('delete_record',{record_id:records.value})});button('Démarrer / arrêter DNS',content,()=>data&&operate('set_service_status',{status:data.service.service_status==='running'?'stopped':'running'}));button('Autoriser / bloquer le transport DNS',content,()=>data&&operate('set_transport_allowed',{allowed:!data.service.transport_allowed}));const resolver=document.createElement('input'),suffix=document.createElement('input');resolver.placeholder='IP du DNS du client';suffix.placeholder='Suffixe du client';resolver.setAttribute('aria-label','IP du résolveur client');suffix.setAttribute('aria-label','Suffixe DNS client');content.append(resolver,suffix);button('Lire la configuration client',content,()=>{if(data){resolver.value=data.service.clients.client.dns_server_ip||'';suffix.value=data.service.clients.client.search_suffix}});button('Appliquer au client',content,()=>operate('set_client_dns',{client_id:'client',dns_server_ip:resolver.value||null,search_suffix:suffix.value}));reload()})}


function mobility(){openApp('mobility','Portable du technicien · Raccordement et VPN',content=>{const place=document.createElement('select'),mode=document.createElement('select'),password=document.createElement('input'),info=document.createElement('p'),output=document.createElement('pre');place.setAttribute('aria-label','Emplacement du portable');mode.setAttribute('aria-label','Type de raccordement');password.type='password';password.placeholder='Mot de passe de formation VPN';password.setAttribute('aria-label','Mot de passe VPN');for(const [id,label] of Object.entries({wired:'Ethernet',console:'Console série (pas IP)',none:'Déconnecté'})){const o=document.createElement('option');o.value=id;o.textContent=label;mode.append(o)}content.append(info,place,mode,password,output);const reload=async()=>{const s=await api('state'),t=s.technician;place.replaceChildren();for(const [id,p] of Object.entries(t.locations)){const o=document.createElement('option');o.value=id;o.textContent=p.label||id;place.append(o)}place.value=t.location;mode.value=t.connection;info.textContent=t.location+' · '+t.connection+' · '+t.access.reason;output.textContent=t.pending?'Raccordement à confirmer : '+JSON.stringify(t.pending,null,2):'VPN '+(t.vpn_connected?'connecté':'déconnecté')+' · '+(t.vpn_expires_at?'expiration '+new Date(t.vpn_expires_at*1000).toLocaleTimeString():'sans session');};const run=async(path,data={})=>{try{const v=await api(path,data);await reload();if(v.result)output.textContent=v.result.code}catch(e){await reload().catch(()=>{});output.textContent+='\n'+e.message}await check()};button('Actualiser',content,reload);button('Déplacer et raccorder',content,()=>run('technician/move',{location:place.value,connection:mode.value}));button('Confirmer après raccordement manuel dans PT',content,()=>run('technician/confirm'));button('Vérifier le réseau maintenant',content,()=>run('refresh'));button('Connecter le VPN',content,async()=>{await run('technician/vpn-connect',{password:password.value});password.value=''});button('Déconnecter le VPN',content,()=>run('technician/vpn-disconnect'));const help=document.createElement('p');help.textContent='Télétravail : raccorde en Ethernet, vérifie le réseau puis connecte le VPN (Formation!2026). Le VPN applique une politique simulée ; aucun tunnel réel n’est créé. En console, utilise la CLI de Packet Tracer. En cas de commande refusée, utilise le raccordement indiqué puis confirme ici.';content.append(help);reload().catch(e=>output.textContent=e.message)})}

function field(parent,label,value='',type='text'){const wrap=document.createElement('label'),input=document.createElement('input');wrap.style.display='block';input.type=type;input.value=value;input.setAttribute('aria-label',label);wrap.append(document.createTextNode(label+' '),input);parent.append(wrap);return input}
function pick(parent,label,items){const wrap=document.createElement('label'),select=document.createElement('select');select.setAttribute('aria-label',label);for(const [value,text] of items){const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o)}wrap.append(document.createTextNode(label+' '),select);parent.append(wrap);return select}
function report(parent){const out=document.createElement('p');out.setAttribute('role','status');parent.append(out);return out}
function localFiles(){openApp('local-files','Fichiers du poste · Éditeur',content=>{const files=pick(content,'Fichier local',[]),name=field(content,'Nom','Nouveau.txt'),editor=document.createElement('textarea');editor.setAttribute('aria-label','Texte local');editor.style.cssText='width:95%;height:230px';content.append(editor);const out=report(content);const reload=async()=>{const v=await api('desktop/endpoint/state',{});files.replaceChildren();for(const f of v.service.local_files){const o=document.createElement('option');o.value=f.name;o.textContent=f.name+' · '+f.size+' octets';files.append(o)}};button('Actualiser',content,async()=>{try{await reload();out.textContent='Fichiers actualisés.'}catch(e){out.textContent=e.message}});button('Ouvrir',content,async()=>{try{const v=await api('desktop/endpoint/read-local',{name:files.value});name.value=v.name;editor.value=v.content;out.textContent='Document local ouvert.'}catch(e){out.textContent=e.message}});button('Nouveau',content,()=>{name.value='Nouveau.txt';editor.value=''});button('Enregistrer localement',content,async()=>{try{await api('desktop/endpoint/save-local',{payload:{name:name.value,content:editor.value}});await reload();out.textContent='Document enregistré sur le poste simulé.'}catch(e){out.textContent=e.message}});reload().catch(e=>out.textContent=e.message)})}
function endpointSettings(){openApp('settings','Paramètres du poste · Applications et lecteur',content=>{const network=document.createElement('p'),apps=document.createElement('div'),drive=field(content,'Lecteur Z: — chemin UNC'),out=report(content);content.prepend(network,apps);const run=async(operation,payload)=>{try{await api('desktop/endpoint/operation',{operation,payload});await reload();out.textContent='Paramètres enregistrés.';await check()}catch(e){out.textContent=e.message}};const reload=async()=>{const v=await api('desktop/endpoint/state',{});network.textContent='Interfaces observées dans Packet Tracer : '+JSON.stringify(v.network.client||[])+' — Pour modifier l’adresse ou le câble, utilise Packet Tracer puis « Vérifier maintenant ».';drive.value=v.service.mapped_drive.path;apps.replaceChildren();for(const [id,label] of Object.entries(v.applications)){const row=document.createElement('label'),b=document.createElement('input');row.style.display='block';b.type='checkbox';b.checked=v.service.applications.includes(id);b.disabled=['settings','login','terminal'].includes(id);b.onchange=()=>run('set_application',{id,installed:b.checked});row.append(b,document.createTextNode(label));apps.append(row)}};button('Actualiser',content,async()=>{try{await reload()}catch(e){out.textContent=e.message}});button('Reconnecter le lecteur au chemin saisi',content,()=>run('set_drive',{path:drive.value}));reload().catch(e=>out.textContent=e.message)})}
function printingApp(){openApp('printers','Imprimantes · File d’attente',content=>{let data=null;const info=document.createElement('p');content.append(info);const queue=pick(content,'File',[]),docs=pick(content,'Document local',[]),jobs=document.createElement('div');content.append(jobs);const out=report(content),port=field(content,'Adresse du port de la file'),pages=field(content,'Feuilles à ajouter',20,'number');const reload=async()=>{const v=await api('desktop/printing/'+(technician?'admin':'state'),{});data=v.service;const selected=queue.value;queue.replaceChildren();for(const q of Object.values(data.queues)){const o=document.createElement('option');o.value=q.id;o.textContent=q.name+(q.id===data.default_queue?' · par défaut':'');queue.append(o)}queue.value=data.queues[selected]?selected:data.default_queue;show();if(!technician){const e=await api('desktop/endpoint/state',{});docs.replaceChildren();for(const f of e.service.local_files){const o=document.createElement('option');o.value=f.name;o.textContent=f.name;docs.append(o)}}};function show(){if(!data)return;const q=data.queues[queue.value];port.value=q.port_ip||'';info.textContent='Spouleur '+(data.spooler_running?'démarré':'arrêté')+' · '+q.name+' · '+(q.paused?'en pause':'active')+' · '+(q.use_offline?'hors connexion':'en ligne')+' · pilote '+(q.driver_valid?'installé':'inutilisable')+' · papier '+data.printer.paper_pages+' · '+data.printer.proxy;jobs.replaceChildren();for(const j of data.jobs){const row=document.createElement('p');row.textContent='#'+j.id+' '+j.name+' · '+({queued:'en attente',blocked:'bloqué',printed:'imprimé (simulé)',cancelled:'annulé'}[j.status]||j.status)+' · '+(j.detail||'');if(['queued','blocked'].includes(j.status))button('Annuler',row,()=>operate('cancel_job',{id:j.id}));jobs.append(row)}}const operate=async(operation,payload={})=>{try{await api('desktop/printing/operation',{operation,payload});await reload();out.textContent='Modification enregistrée.'}catch(e){out.textContent=e.message}};queue.onchange=show;button('Actualiser',content,async()=>{try{await reload()}catch(e){out.textContent=e.message}});if(!technician)button('Imprimer sur la file sélectionnée',content,async()=>{try{const v=await api('desktop/printing/print',{name:docs.value,queue_id:queue.value});await reload();out.textContent=v.result.code==='PRINTED'?'Travail imprimé dans la simulation.':v.result.code==='QUEUED'?'Travail accepté, encore en attente.':v.result.code}catch(e){out.textContent=e.message}});button('Choisir comme imprimante par défaut',content,()=>data&&operate('set_default',{queue_id:queue.value}));button('Démarrer / arrêter le spouleur',content,()=>data&&operate('set_spooler',{running:!data.spooler_running}));button('Redémarrer le spouleur',content,()=>operate('restart_spooler'));button('Suspendre / reprendre la file',content,()=>data&&operate('set_paused',{queue_id:queue.value,value:!data.queues[queue.value].paused}));button('Basculer le mode hors connexion',content,()=>data&&operate('set_offline',{queue_id:queue.value,value:!data.queues[queue.value].use_offline}));button('Installer le pilote de formation',content,()=>operate('set_driver',{queue_id:queue.value,value:true}));button('Appliquer le port IP',content,()=>operate('set_port',{queue_id:queue.value,ip:port.value}));button('Charger le papier',content,()=>operate('add_paper',{pages:Number(pages.value)}));const help=document.createElement('p');help.textContent='L’impression est simulée. Le ping vers l’imprimante provient de Packet Tracer ; il ne valide pas un protocole d’impression réel. Un travail accepté peut rester bloqué.';content.append(help);reload().catch(e=>out.textContent=e.message)})}
function ftpClient(){openApp('ftp','Client FTP · Dépôt de formation',content=>{let revision=null;const info=document.createElement('p');info.textContent='Transferts simulés, dépendants de la connectivité Packet Tracer. Compte de formation : depot / Formation!2026.';content.append(info);const user=field(content,'Compte','depot'),password=field(content,'Mot de passe','','password'),files=pick(content,'Fichier du dépôt',[]),local=pick(content,'Fichier local',[]),out=report(content);const run=async(action,payload={})=>{const v=await api('desktop/ftp/'+action,{payload});revision=v.revision;out.textContent=v.result.code;if(!v.result.allowed)throw Error(v.result.code);return v.result};const localList=async()=>{const v=await api('desktop/endpoint/state',{});local.replaceChildren();for(const f of v.service.local_files){const o=document.createElement('option');o.value=f.name;o.textContent=f.name;local.append(o)}};const listing=async()=>{const r=await run('list');files.replaceChildren();for(const f of r.files){const o=document.createElement('option');o.value=f.name;o.textContent=f.name+' · '+f.size+' octets';files.append(o)}await localList()};const safe=async(fn)=>{try{await fn()}catch(e){out.textContent=e.message}};button('Se connecter',content,()=>safe(async()=>{await run('login',{username:user.value,password:password.value});password.value='';await listing()}));button('Actualiser le dépôt',content,()=>safe(listing));button('Télécharger vers le poste',content,()=>safe(async()=>{await run('download',{name:files.value});await localList();out.textContent='Téléchargement simulé terminé. Consulte Fichiers locaux.'}));button('Envoyer le fichier local',content,()=>safe(async()=>{const v=await api('desktop/endpoint/read-local',{name:local.value});await run('upload',{name:v.name,content:v.content,expected_revision:revision});await listing();out.textContent='Transfert simulé terminé.'}));button('Déconnexion FTP',content,()=>safe(async()=>{await run('logout');files.replaceChildren();password.value=''}));localList().catch(e=>out.textContent=e.message)})}
function ftpAdmin(){openApp('ftp-admin','Serveur FTP · Service et comptes',content=>{let data=null;const info=document.createElement('p');content.append(info);const accounts=document.createElement('div');content.append(accounts);const capacity=field(content,'Capacité du dépôt (octets)',1048576,'number'),out=report(content);const reload=async()=>{const v=await api('desktop/ftp/admin',{});data=v.service;info.textContent=v.server.name+' · '+v.server.ip+' · service '+(data.service_running?'démarré':'arrêté')+' · contrôle '+(data.control_allowed?'autorisé':'bloqué')+' · données '+(data.data_allowed?'autorisées':'bloquées')+' · '+data.files.reduce((n,f)=>n+f.size,0)+' / '+data.capacity_bytes+' octets';capacity.value=data.capacity_bytes;accounts.replaceChildren();for(const [username,a] of Object.entries(data.accounts)){const row=document.createElement('div');row.append(document.createTextNode(username+' '));for(const [field,label] of Object.entries({enabled:'Actif',read:'Télécharger / lister',write:'Envoyer'})){const wrap=document.createElement('label'),b=document.createElement('input');b.type='checkbox';b.checked=a[field];b.onchange=()=>operate('set_account',{username,field,value:b.checked});wrap.append(b,document.createTextNode(label));row.append(wrap)}button('Réinitialiser le mot de passe de formation',row,()=>operate('reset_password',{username}));accounts.append(row)}};const operate=async(operation,payload)=>{try{await api('desktop/ftp/operation',{operation,payload});await reload();out.textContent='Configuration enregistrée. Reconnecte le client FTP si sa session a été invalidée.'}catch(e){out.textContent=e.message}};button('Actualiser',content,async()=>{try{await reload()}catch(e){out.textContent=e.message}});button('Démarrer / arrêter FTP',content,()=>data&&operate('set_service',{value:!data.service_running}));button('Autoriser / bloquer le contrôle',content,()=>data&&operate('set_control',{value:!data.control_allowed}));button('Autoriser / bloquer les données',content,()=>data&&operate('set_data',{value:!data.data_allowed}));button('Appliquer la capacité',content,()=>operate('set_capacity',{bytes:Number(capacity.value)}));reload().catch(e=>out.textContent=e.message)})}
function updateIcons(s){const root=document.getElementById('desktopIcons');if(!root)return;const ids=technician?['remote','terminal','notes','directory','file-admin','dns','mobility','printers','ftp-admin']:['local-files',...(s.desktop_services?.endpoint.applications||['documents','terminal','dns','login'])];const signature=ids.join(',');if(root.dataset.signature===signature)return;root.dataset.signature=signature;root.replaceChildren();const catalogue={'remote':['💻 Accès distant',remote],terminal:['⌨ Terminal réseau',terminal],notes:['📝 Notes',notes],directory:['👥 Annuaire',directory],'file-admin':['📁 Partages',fileAdmin],dns:['🌐 DNS',dnsConsole],mobility:['💼 Mobilité et VPN',mobility],printers:['🖨 Imprimantes',printingApp],'ftp-admin':['🗄 Serveur FTP',ftpAdmin],ftp:['📤 Client FTP',ftpClient],settings:['⚙ Paramètres',endpointSettings],documents:['📁 Documents partagés',explorer],login:['👤 Session utilisateur',login],'local-files':['📝 Fichiers locaux',localFiles]};for(const id of ids){const entry=catalogue[id];if(entry){const icon=button(entry[0],root,entry[1]),symbol=document.createElement('span'),label=document.createElement('span');symbol.className='desktop-symbol';symbol.setAttribute('aria-hidden','true');symbol.textContent=entry[0].split(' ')[0];label.className='desktop-label';label.textContent=entry[0].split(' ').slice(1).join(' ');icon.replaceChildren(symbol,label);icon.setAttribute('aria-label',label.textContent)}}if(!technician){document.getElementById('explorer').hidden=!ids.includes('documents');const dns=document.getElementById('clientDNS');if(dns)dns.hidden=!ids.includes('dns')}}

async function boot(){try{const s=await api('state');if(!s||(expectedEnvironment&&s.environment_id!==expectedEnvironment)||(!technician&&(!s.remote_session||!s.checks.remote.allowed))){closeSession();return}expectedEnvironment=s.environment_id;const {Core,CoreServiceProvider}=osjsClient;core=new Core({standalone:true,development:false,ws:{disabled:true},packages:{metadata:[],manifest:null},session:{enabled:false}},{root:document.getElementById('root')});core.register(CoreServiceProvider);core.singleton('osjs/settings',()=>({get:()=>undefined,set:()=>({save:async()=>true})}));if(!await core.boot())throw Error('Démarrage OS.js impossible');updateIcons(s);document.getElementById('status').textContent=s.devices[technician?'technician':'client'].name+' · '+s.company;if(!technician&&(s.desktop_services?.endpoint.applications||['documents']).includes('documents'))explorer()}catch(e){document.getElementById('status').textContent=e.message}}
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.getElementById('status').textContent='Plein écran indisponible : ouvre le bureau dans un onglet séparé.'}};document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').textContent=document.fullscreenElement?'Quitter le plein écran':'Plein écran');
if(technician){document.title='Bureau du technicien';document.getElementById('explorer').textContent='Accès distant';document.getElementById('disconnect').textContent='Fermer le bureau';document.getElementById('offline').textContent='Cet environnement a changé ou n’est plus disponible. Rouvre le bureau depuis la session active.';}
async function remote(){try{const s=await api('state');document.getElementById('status').textContent='Connexion à '+s.devices.client.name+' en cours…';await api('action',{action:'connect',target_serial:s.devices.client.serial});window.open(base+'/desktop#'+encodeURIComponent(expectedEnvironment),'_blank','noopener')}catch(e){document.getElementById('status').textContent=e.message}}
function notes(){openApp('notes','Notes du technicien · locales à ce navigateur',content=>{const field=document.createElement('textarea');field.style.cssText='width:100%;height:220px';field.setAttribute('aria-label','Notes du technicien');const key='netops-tech-notes:'+expectedEnvironment;try{field.value=localStorage.getItem(key)||''}catch(e){}content.append(field);const info=document.createElement('p');info.textContent='Ces notes restent dans ce navigateur, même sans réseau. Elles ne sont pas incluses dans la sauvegarde entreprise.';content.append(info);field.oninput=()=>{try{localStorage.setItem(key,field.value)}catch(e){info.textContent='Impossible de sauvegarder les notes dans ce navigateur.'}}})}
if(!technician){const dnsButton=document.createElement('button');dnsButton.id='clientDNS';dnsButton.textContent='DNS';dnsButton.onclick=dnsConsole;document.getElementById('bar').prepend(dnsButton);const b=document.createElement('button');b.textContent='Session utilisateur';b.onclick=login;document.getElementById('bar').prepend(b)}
document.getElementById('explorer').onclick=technician?remote:explorer;document.getElementById('terminal').onclick=terminal;document.getElementById('disconnect').onclick=async()=>{if(technician){closeSession();window.close();return}try{await api('action',{action:'disconnect'})}finally{closeSession()}};boot();setInterval(check,2000);
