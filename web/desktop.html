<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bureau distant</title>
<link rel="stylesheet" href="/osjs/main.css">
<style>
html,body{height:100%;margin:0;font:14px system-ui;color:#193047}body{background:linear-gradient(135deg,#12334e,#246a86)}#bar{position:absolute;bottom:0;height:48px;left:0;right:0;background:#11293ded;color:white;display:flex;gap:12px;align-items:center;padding:0 14px;z-index:100000}button,input{font:inherit;padding:9px;border:1px solid #c9d7e2;border-radius:5px}button{cursor:pointer;background:#e8f3ff;color:#194c71}button:disabled{opacity:.5}#status{position:absolute;top:14px;left:18px;right:18px;color:white}#root{position:absolute;inset:48px 0 48px}#root .osjs-contents{position:absolute;inset:0}.osjs-window{background:white;border-radius:8px;box-shadow:0 10px 35px #0005;border:1px solid #b7c8d6}.osjs-window-header{background:#e9f0f7;height:32px;color:#16334e}.osjs-window-button{width:28px;cursor:pointer}.osjs-window-button[data-action="close"]::after{content:'×'}.osjs-window-button[data-action="minimize"]::after{content:'−'}.osjs-window-button[data-action="maximize"]::after{content:'□'}.osjs-window-content{padding:16px;box-sizing:border-box;overflow:auto}.app-message{white-space:pre-wrap;color:#9b3039}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#132738;color:#e0f1ff;padding:12px;max-height:220px;overflow:auto}ul{padding-left:20px}#disconnect{margin-left:auto}#offline{position:absolute;inset:0;background:#12334e;z-index:200000;color:white;padding:40px;box-sizing:border-box}#offline[hidden]{display:none}
</style>
<div id="status">Connexion au bureau…</div><div id="root"></div><div id="bar"><button id="explorer">Documents</button><button id="terminal">Terminal réseau</button><span>OS.js · Session simulée</span><button id="disconnect">Déconnecter</button></div><div id="offline" hidden>Session distante fermée. Vérifie le réseau puis reconnecte-toi depuis l’interface principale.</div>
<script src="/osjs/main.js"></script><script>
const token='__TOKEN__',base='__API_BASE__';let core=null,stopped=false,polling=false;const windows=new Map();
async function api(path,data){const r=await fetch(base+'/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Diagnostic-Token':token},body:data===undefined?undefined:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
function closeSession(){if(stopped)return;stopped=true;for(const w of windows.values())w.destroy();windows.clear();if(core)core.destroy();document.getElementById('offline').hidden=false}
async function check(){if(polling||stopped)return;polling=true;try{const s=await api('state');if(!s?.remote_session||!s.checks.remote.allowed){closeSession();return}document.getElementById('status').textContent=s.devices.client.name+' · '+s.devices.client.ip+' · '+s.company}catch(e){closeSession()}finally{polling=false}}
function openApp(id,title,render){if(stopped||!core)return;if(windows.has(id)){windows.get(id).focus();return}const w=core.make('osjs/window',{id,title,dimension:{width:470,height:350},position:{left:35+windows.size*25,top:25+windows.size*20},attributes:{minimizable:false,maximizable:true}});windows.set(id,w);w.on('destroy',()=>windows.delete(id));w.render(render);w.focus()}
function button(label,parent,fn){const b=document.createElement('button');b.textContent=label;parent.append(b);b.onclick=async()=>{b.disabled=true;try{await fn()}finally{b.disabled=false}};return b}
function explorer(){openApp('documents','Explorateur · Documents partagés',($content)=>{const intro=document.createElement('p');intro.textContent='Partage Documents · droits de lecture et d’écriture distincts';const listing=document.createElement('ul'),message=document.createElement('p');message.className='app-message';$content.append(intro,listing,message);const run=async action=>{try{const v=await api('action',{action});listing.replaceChildren(...v.files.map(name=>{const li=document.createElement('li');li.textContent=name;return li}));message.textContent=action==='write'?'Test.txt créé.':''}catch(e){message.textContent=e.message}await check()};button('Ouvrir Documents',$content,()=>run('read'));button('Créer Test.txt',$content,()=>run('write'));run('read')})}
function terminal(){openApp('terminal','Terminal · Ping dans Packet Tracer',($content)=>{const p=document.createElement('p');p.textContent='Commande exécutée sur le poste client simulé dans Packet Tracer.';const input=document.createElement('input');input.placeholder='Adresse IPv4 ou IPv6';input.setAttribute('aria-label','Destination du ping');const output=document.createElement('pre');output.textContent='En attente d’une commande.';$content.append(p,input);api('state').then(s=>{if(s)input.value=s.devices.server.ip});button('Ping',$content,async()=>{output.textContent='Ping en cours…';try{const v=await api('ping',{target:input.value});output.textContent=v.detail||'Aucun résultat'}catch(e){output.textContent=e.message}await check()});$content.append(output)})}
async function boot(){try{const s=await api('state');if(!s?.remote_session||!s.checks.remote.allowed){closeSession();return}const {Core,CoreServiceProvider}=osjsClient;core=new Core({standalone:true,development:false,ws:{disabled:true},packages:{metadata:[],manifest:null},session:{enabled:false}},{root:document.getElementById('root')});core.register(CoreServiceProvider);core.singleton('osjs/settings',()=>({get:()=>undefined,set:()=>({save:async()=>true})}));if(!await core.boot())throw Error('Démarrage OS.js impossible');await check();explorer()}catch(e){document.getElementById('status').textContent=e.message}}
document.getElementById('explorer').onclick=explorer;document.getElementById('terminal').onclick=terminal;document.getElementById('disconnect').onclick=async()=>{try{await api('action',{action:'disconnect'})}finally{closeSession()}};boot();setInterval(check,2000);
</script></html>
