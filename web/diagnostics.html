<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paramètres et diagnostics</title>
<style>html{font:14px system-ui;color:#193047;background:#f5f8fc}body{margin:20px}h1{font-size:23px}button,select{font:inherit;border:1px solid #c9d7e2;border-radius:7px;padding:10px;background:white;color:#194c71}button{cursor:pointer}button:disabled{opacity:.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.card{background:white;border:1px solid #dce5ed;border-radius:12px;padding:18px;margin:16px 0}.row{display:flex;justify-content:space-between;gap:16px;padding:10px;border-bottom:1px solid #edf2f7}.row span:last-child{overflow-wrap:anywhere;text-align:right}.passed{color:#187452}.failed{color:#a22d3a}.unknown,.blocked{color:#705722}p{line-height:1.6}#message{white-space:pre-wrap}h2{font-size:18px}small{color:#52657a}</style>
<h1>Paramètres et diagnostics</h1><p>Les états réseau sont des observations de Packet Tracer. Les comptes et services sont simulés. Un ping réussi ne prouve pas un accès Internet, SMB ou une connexion distante réelle.</p>
<div class="toolbar"><select id="target" aria-label="Poste à examiner"></select><button id="read">Actualiser les informations</button><button id="verify">Vérifier ce poste</button><button id="export">Exporter le rapport</button></div><p id="message" role="status" aria-live="polite"></p><div id="cards"></div>
<script>
const token='__TOKEN__',base='__API_BASE__',environment=decodeURIComponent(location.hash.slice(1));let client=new URLSearchParams(location.search).get('client_serial'),report=null,busy=false;const $=id=>document.getElementById(id),labels={passed:'Confirmé',failed:'Échec observé / prérequis refusé',unknown:'Non vérifié ou preuve périmée',blocked:'Non évalué : prérequis bloquant'};
async function request(path,data){const r=await fetch(base+'/'+path+(data===undefined&&client?'?client_serial='+encodeURIComponent(client):''),{method:data===undefined?'GET':'POST',headers:{'X-Diagnostic-Token':token,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify({...data,environment_id:environment,...(client?{client_serial:client}:{})})});const value=await r.json();if(!r.ok)throw Error(value.error||'Diagnostic indisponible');return value}
function card(title){const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent=title;section.append(h);$('cards').append(section);return section}
function row(parent,label,value,status){const r=document.createElement('div'),a=document.createElement('span'),b=document.createElement('span');r.className='row';a.textContent=label;b.textContent=value??'Non renseigné';if(status)b.className=status;r.append(a,b);parent.append(r)}
function draw(s){$('cards').replaceChildren();const identity=card('Environnement et identité');row(identity,'Entreprise',s.company);row(identity,'Environnement',s.environment_id);row(identity,'Fichier généré',s.network_file);row(identity,'Fichier associé au contrôle',typeof s.bound_file==='object'?JSON.stringify(s.bound_file):s.bound_file);const pc=s.devices?.client||{};row(identity,'Poste examiné',pc.name);row(identity,'Numéro de série',pc.serial);row(identity,'Adresse IP',pc.ip);const observation=card('Preuves réseau');const probes=s.observation?.probes||{};for(const [key,p] of Object.entries(probes)){const age=p.at?Date.now()/1000-p.at:null,effective=age===null||age<0||age>45?'unknown':p.status;row(observation,key,labels[effective]||effective,effective);row(observation,'Fraîcheur',age===null?'Aucune date':Math.max(0,Math.floor(age))+' s · validité maximale 45 s');row(observation,'Dernière observation',p.at?new Date(p.at*1000).toLocaleString():'Jamais');row(observation,'Résultat du contrôle',p.detail);row(observation,'Source → cible',(p.source_device||'?')+' → '+(p.target||'?'))}if(!Object.keys(probes).length)row(observation,'État','Aucune preuve détaillée disponible','unknown');for(const [key,c] of Object.entries(s.checks||{})){const section=card({remote:'Prise en main',read:'Lecture des documents',write:'Écriture des documents'}[key]||key);function visit(n,depth=0){if(!n)return;row(section,'· '.repeat(depth)+n.label,labels[n.status]||n.status,n.status);for(const child of n.children||[])visit(child,depth+1)}visit(c.tree)}report={schema:'netops-diagnostics-v1',exported_at:new Date().toISOString(),environment_id:s.environment_id,company:s.company,network_file:s.network_file,bound_file:s.bound_file,client:{name:pc.name,serial:pc.serial,ip:pc.ip},observation:s.observation,checks:s.checks};$('export').disabled=false}
async function run(fn){if(busy)return;busy=true;for(const id of ['target','read','verify','export'])$(id).disabled=true;$('message').textContent='Chargement…';try{await fn()}catch(e){report=null;$('cards').replaceChildren();$('message').textContent=e.message}finally{busy=false;for(const id of ['target','read','verify'])$(id).disabled=false;$('export').disabled=!report}}
async function load(){const s=await request('state');if(!s)throw Error('Crée ou reprends un environnement depuis Accueil et sessions.');if(!environment||s.environment_id!==environment)throw Error('Cet environnement a changé. Ferme cette fenêtre et rouvre les diagnostics.');const select=$('target');select.replaceChildren();for(const p of (s.workstations||[]).filter(p=>p.remote_supported)){const option=document.createElement('option');option.value=p.serial;option.textContent=p.name+' · '+(p.user||'Utilisateur non associé');select.append(option)}client=client||s.client_serial;select.value=client;draw(s);$('message').textContent='Informations lues sans lancer de ping ni modifier le réseau.'}
$('target').onchange=()=>{client=$('target').value;run(load)};$('read').onclick=()=>run(load);$('verify').onclick=()=>run(async()=>{const s=await request('refresh',{});if(!s||s.environment_id!==environment)throw Error('Environnement indisponible.');draw(s);$('message').textContent='Contrôle discret terminé. Ce contrôle manuel peut accélérer le temps de simulation de Packet Tracer pour tout le réseau ; aucune configuration réseau modifiée.'});$('export').onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='diagnostic-environnement.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};run(load);
</script></html>
